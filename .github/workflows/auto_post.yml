name: Auto Post to Telegram

on:
  schedule:
    - cron: '0 */4 * * *'  # Har 4 ghante me auto trigger
  workflow_dispatch:       # Manual test button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Script
        run: python main.py
